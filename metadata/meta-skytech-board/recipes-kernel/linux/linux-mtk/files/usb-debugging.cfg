# USB Host/Device support
CONFIG_USB=y
CONFIG_USB_GADGET=y
CONFIG_USB_G_SERIAL=y
CONFIG_USB_G_ACM=y

# FTDI USB-Serial support
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_CP210X=y

# CDC ACM support
CONFIG_USB_ACM=y
CONFIG_USB_CDC_COMPOSITE=y

# USB OTG support (for dual-role)
CONFIG_USB_OTG=y
CONFIG_USB_DWC3=y

# Debug support
CONFIG_USB_DEBUG=y
CONFIG_USB_GADGET_DEBUG=y
