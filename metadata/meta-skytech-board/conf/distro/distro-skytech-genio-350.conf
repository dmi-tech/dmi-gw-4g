require conf/distro/rity.conf
# ===================== Distro: custom (Genio 350) =====================
# Image/WIC
WKS_FILE = "mediatek-bootimg.wks"
WIC_CREATE_EXTRA_ARGS = "--no-fstab-update"

# ===== Base features & init =====
DISTRO_FEATURES:append = " security usrmerge systemd pam"
# Runtime ptest suites are not needed on the deploy image and trigger a
# pseudo/tar failure in Perl on this host.
DISTRO_FEATURES:remove = " ptest"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_udev = "udev"
PREFERRED_PROVIDER_virtual/udev = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# ===== Image features =====
IMAGE_FEATURES += " ssh-server-openssh"
EXTRA_IMAGE_FEATURES += " debug-tweaks"

IMAGE_INSTALL:append = " \
    udev \
    dhcpcd \
    opencl-headers opencl-icd-loader clinfo \
    gstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
    gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
    i2c-tools can-utils usbutils \
    nano python3 python3-pip \
    networkmanager avahi-daemon networkmanager-wifi \
    iproute2 iputils net-tools procps gdb \
    alsa-state \
	alsa-utils \
    pipewire \
	pipewire-spa-tools \
	pipewire-tools \
	pipewire-alsa \
	pipewire-pulse \
	pipewire-v4l2 \
	pipewire-modules-rt \
	pipewire-modules-protocol-native \
	pipewire-modules-client-node \
	pipewire-modules-client-device \
	pipewire-modules-adapter \
	pipewire-modules-metadata \
	pipewire-modules-session-manager \
	pipewire-modules-profiler \
	pipewire-modules-spa-device-factory \
	pipewire-modules-portal \
	pipewire-modules-access \
	pipewire-modules-link-factory \
	pipewire-spa-plugins-dbus \
	pipewire-spa-plugins-bluez5 \
	pipewire-spa-plugins-codec-bluez5-aac \
	pipewire-spa-plugins-codec-bluez5-lc3 \
	pipewire-spa-plugins-v4l2 \
	pipewire-spa-plugins-alsa \
	wireplumber \
	wireplumber-modules-lua-scripting \
	wireplumber-modules-default-nodes-api \
	wireplumber-modules-meta \
	wireplumber-modules-file-monitor-api \
	wireplumber-modules-si-audio-adapter \
	wireplumber-modules-si-standard-link \
	wireplumber-modules-si-node \
	wireplumber-modules-mixer-api \
	wireplumber-modules-logind \
"
