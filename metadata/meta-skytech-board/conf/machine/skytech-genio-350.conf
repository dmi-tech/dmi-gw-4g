require conf/machine/genio-350-evk.conf

# Custom memory configuration for 2GB RAM board
# OP-TEE gets 64MB, Linux gets the rest
OPTEE_DRAM_SIZE = "0x4000000"

# Use overlay device tree
KERNEL_DEVICETREE = "mediatek/mt8365-evk.dtb"
KERNEL_DEVICETREE_OVERLAYS_AUTOLOAD += "gpu-mali.dtbo"
# Board identification
LIBDRAM_BOARD_NAME = "mt8365-sb35"
LK_BOARD_NAME = "${LIBDRAM_BOARD_NAME}"

# FORCE override WKS file
WKS_FILE:forcevariable = "genio-350-16gb.wks"

# Dependencies
WKS_FILE_DEPENDS = "dosfstools-native mtools-native parted-native e2fsprogs-native wic-tools"

# wic.img + tar.xz
IMAGE_FSTYPES += "wic.img"

# Enhanced features cho development
IMAGE_FEATURES += "package-management debug-tweaks ssh-server-openssh"
SERIAL_CONSOLE = "921600;ttyS0"
APPEND += " console=ttyS0,921600n1"
