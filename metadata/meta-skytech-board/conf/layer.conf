# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "\
  ${LAYERDIR}/recipes-*/*/*.bb \
  ${LAYERDIR}/recipes-*/*/*.bbappend \
  ${LAYERDIR}/recipes-*/*/*/*.bb \
  ${LAYERDIR}/recipes-*/*/*/*.bbappend \
"
BBFILE_COLLECTIONS += "skytech-genio-350"
BBFILE_PATTERN_skytech-genio-350 = "^${LAYERDIR}/"
BBFILE_PRIORITY_skytech-genio-350 = "15"

LAYERVERSION_skytech-genio-350 = "1"
LAYERSERIES_COMPAT_skytech-genio-350 = "scarthgap"

# Layer dependencies
LAYERDEPENDS_skytech-genio-350 = "core"

# Layer information for Build Configuration display
LAYERDESCRIPTION_skytech-genio-350 = "Custom board layer for Genio 350-EVK with 2GB RAM and 16GB ROM"
LAYERMAINTAINER_skytech-genio-350 = "VietN DMI"

# Additional layer metadata
LAYER_CONF_VERSION = "7"
