# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# bblayers.conf - Final version with all layer dependencies resolved
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS ?= " \
  ${TOPDIR}/metadata/poky/meta \
  ${TOPDIR}/metadata/poky/meta-poky \
  ${TOPDIR}/metadata/poky/meta-yocto-bsp \
  ${TOPDIR}/metadata/meta-openembedded/meta-oe \
  ${TOPDIR}/metadata/meta-openembedded/meta-python \
  ${TOPDIR}/metadata/meta-openembedded/meta-multimedia \
  ${TOPDIR}/metadata/meta-openembedded/meta-networking \
  ${TOPDIR}/metadata/meta-arm/meta-arm \
  ${TOPDIR}/metadata/meta-arm/meta-arm-toolchain \
  ${TOPDIR}/metadata/meta-clang \
  ${TOPDIR}/metadata/meta-mediatek-bsp \
  ${TOPDIR}/metadata/meta-security \
  ${TOPDIR}/metadata/meta-rity/meta \
  ${TOPDIR}/metadata/meta-rity/meta-rity-bringup \
  "
BBLAYERS += "${TOPDIR}/metadata/meta-skytech-board"
